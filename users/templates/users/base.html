{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SocialBee | Auth</title>
</head>
<body>
    {% if request.user.is_authenticated %}
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Log Out</button>
        </form>
    {% else %}
       <form action="{% url 'login' %}">
            {% csrf_token %}
            <button type="submit">Log In</button>
        </form>
    {% endif %}

    {% block body %}

    {% endblock %}
</body>
</html>
