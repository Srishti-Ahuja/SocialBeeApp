{% extends 'users/base.html' %}
{% load static %}

{% block body %}
    {% if validlink %}
        <h1>Change Password</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit">
        </form>
    {% else %}
        <h1>Invalid Reset Password Link</h1>
    {% endif %}
{% endblock %}
